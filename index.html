<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="text-area">

            <h1>Crie seu código QR em apenas alguns cliques</h1>
            <p>Cole uma URL ou insira um texto para criar seu código QR</p>

            <input type="text" id="text" placeholder="Digite aqui...">

            <button onclick="gerarQR()">Gerar código QR</button>

        </div>

        <div class="qr-area">
            <div id="qrcode"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
